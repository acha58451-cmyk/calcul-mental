
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<h1>Défi Multiplication 🧠</h1></head>
<body>
    <h1>Mon application de calcul mental</h1>
     <label for="difficulte">Difficulté :</label>

<select id="difficulte">
    <option value="facile">Facile</option>
    <option value="moyen" selected>Moyen</option>
    <option value="difficile">Difficile</option>
</select>
    <h2 id="question"></h2>
    <p id="chronometre">Temps restant : 10 s</p>

    <input type="number" id="reponse"
           placeholder="Ta réponse">

    <button id="valider">Valider</button>
    <button id="recommencer">Recommencer</button>
    <button id="suivant" disabled>Question suivante</button>

    <p id="resultat"></p>
    <p id="score">Score : 0 / 0</p>

    <script src="script.js"></script>
</body>
</html>
